[package]
name = "indieark-setup"
version = "0.2.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
panic = "abort"
strip = true
lto = true
codegen-units = 1
